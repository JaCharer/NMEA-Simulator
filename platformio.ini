; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:esp32dev]
platform = espressif32
board = esp32dev ; TTGO używa standardowego profilu esp32dev
framework = arduino
monitor_speed = 921600
;monitor_filters = log2file
lib_deps =
  ;SignalK/SensESP @ ^3.0.0
  bodmer/TFT_eSPI @ ^2.5.0 ; Dorzucamy genialną bibliotekę graficzną
  me-no-dev/AsyncTCP
  me-no-dev/ESPAsyncWebServer
  bblanchon/ArduinoJson @ ^7.0.0
  ttlappalainen/NMEA2000-Library @ ^4.17.2
  ttlappalainen/NMEA2000_esp32 @ ^1.0.3
build_flags = 
   ; Włącza obsługę C++14, w tym generycznych lambd
  -std=gnu++14
  -D SIMMULATE_NMEA2000 ; Włącza symulację NMEA 2000
 
  ; Konfiguracja pinów CAN dla NMEA 2000
  ; -D ESP32_CAN_TX=GPIO_NUM_25
  ; -D ESP32_CAN_RX=GPIO_NUM_26
  -D USE_LCD ; Odkomentuj, jeśli chcesz używać ekranu (TTGO T-Display)
  -D USE_BUTTONS ; Odkomentuj, jeśli chcesz używać przycisków (TTGO T-Display)
  ;-D STEADY_WIND_FOR_TESTS ; Odkomentuj, jeśli chcesz używać stałego wiatru dla testów
  ;-D STEADY_WIND_SPEED=18.0 ; Prędkość wiatru dla testów
  ;-D STEADY_WIND_DIR=0.0   ; Kierunek wiatru dla testów
  ; Flagi konfiguracyjne wprost pod ekran TTGO T-Display
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  -D CGRAM_OFFSET=1
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=23
  -D TFT_BL=4
  -D TFT_INVERSION_ON=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=27000000

board_build.filesystem = littlefs
upload_port = /dev/cu.usbserial-01EAF6A0

; Wymuszenie portu dla Serial Monitora (często to ten sam port, ale przy S3 mogą być różne!)
monitor_port = /dev/cu.usbserial-01EAF6A0